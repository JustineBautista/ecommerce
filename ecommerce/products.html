<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop All Products — NexaMart</title>
  
  <!-- Global & Page CSS files -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>

  <!-- Persistent Header Navigation -->
  <header></header>

  <!-- Main Shop Catalog Section -->
  <main class="container section-padding">
    <div class="catalog-layout">
      
      <!-- Collapsible Sidebar Filters -->
      <aside class="catalog-sidebar glass">
        
        <!-- Categories selector -->
        <div class="filter-section">
          <h4 class="filter-title">Category</h4>
          <select id="filter-category" class="form-control" style="background:rgba(255,255,255,0.03); color:inherit; border:1px solid var(--glass-border);">
            <option value="">All Categories</option>
            <option value="Electronics">Electronics</option>
            <option value="Fashion">Fashion</option>
            <option value="Home & Living">Home & Living</option>
            <option value="Sports & Outdoors">Sports & Outdoors</option>
            <option value="Books & Media">Books & Media</option>
            <option value="Beauty & Health">Beauty & Health</option>
          </select>
        </div>
        
        <!-- Price Bounds range -->
        <div class="filter-section">
          <h4 class="filter-title">Price Range</h4>
          <div class="price-slider-wrapper">
            <div class="price-inputs">
              <div>
                <span style="font-size:0.75rem;">Min ($)</span>
                <input type="number" id="price-min" placeholder="0" min="0">
              </div>
              <span style="color:var(--text-secondary); margin-top:1.2rem;">-</span>
              <div>
                <span style="font-size:0.75rem;">Max ($)</span>
                <input type="number" id="price-max" placeholder="2000" min="0">
              </div>
            </div>
          </div>
        </div>
        
        <!-- Star Ratings radio filter -->
        <div class="filter-section">
          <h4 class="filter-title">Customer Review</h4>
          <ul class="filter-list">
            <li>
              <label class="form-checkbox">
                <input type="radio" name="filter-rating" value="4">
                <span>4.0+ ⭐ ⭐ ⭐ ⭐</span>
              </label>
            </li>
            <li>
              <label class="form-checkbox">
                <input type="radio" name="filter-rating" value="4.5">
                <span>4.5+ ⭐ ⭐ ⭐ ⭐ ½</span>
              </label>
            </li>
            <li>
              <label class="form-checkbox">
                <input type="radio" name="filter-rating" value="4.8">
                <span>4.8+ ⭐ ⭐ ⭐ ⭐ ⅘</span>
              </label>
            </li>
          </ul>
        </div>
        
        <button onclick="resetAllFilters()" class="btn btn-secondary" style="width:100%; margin-top:1.5rem;">Reset All Filters</button>
      </aside>
      
      <!-- Catalog Grid and sorting -->
      <div>
        <div class="catalog-controls glass">
          <span class="catalog-results-count">Showing 0 products</span>
          <div class="catalog-sort-select">
            <span style="font-size:0.85rem; color:var(--text-secondary); margin-right:0.5rem;">Sort by:</span>
            <select id="catalog-sort">
              <option value="popular">Popularity / Trending</option>
              <option value="price-low">Price: Low to High</option>
              <option value="price-high">Price: High to Low</option>
              <option value="rating">Highest Rated</option>
            </select>
          </div>
        </div>
        
        <!-- Active Filter chips -->
        <div class="active-filters"></div>
        
        <!-- Products Grid Container -->
        <div class="catalog-grid">
          <!-- Rendered in dynamic DOM injection -->
        </div>
        
        <!-- Pagination Links -->
        <div class="pagination"></div>
      </div>
      
    </div>
  </main>

  <!-- Slide-out Shopping Cart Drawer Backdrop and Drawer -->
  <div class="drawer-backdrop"></div>
  <div class="drawer">
    <div class="drawer-header">
      <h3 class="drawer-title">🛒 Your Cart</h3>
      <button class="drawer-close-btn" onclick="window.NexaCart.closeCartDrawer()">&times;</button>
    </div>
    <div class="drawer-body">
      <!-- Items dynamically populated -->
    </div>
    <div class="drawer-footer">
      <div class="drawer-summary-row">
        <span>Subtotal</span>
        <span id="drawer-subtotal">$0.00</span>
      </div>
      <div class="drawer-summary-row" id="drawer-discount-row" style="color:var(--danger); display:none;">
        <span>Discount Coupon</span>
        <span id="drawer-discount">-$0.00</span>
      </div>
      <div class="drawer-summary-row">
        <span>Est. Shipping</span>
        <span id="drawer-shipping">FREE</span>
      </div>
      <div class="drawer-summary-row">
        <span>Est. Taxes (8%)</span>
        <span id="drawer-tax">$0.00</span>
      </div>
      <div class="drawer-summary-row total">
        <span>Order Total</span>
        <span id="drawer-total">$0.00</span>
      </div>
      <a href="checkout.html" class="btn btn-primary" style="width:100%;">Proceed To Checkout &rarr;</a>
    </div>
  </div>

  <!-- Persistent Footer -->
  <footer></footer>

  <!-- Master JavaScript APIs loading -->
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
