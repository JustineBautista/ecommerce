<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout Secure Flow — NexaMart</title>
  
  <!-- Global & Page CSS files -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>

  <!-- Persistent Header Navigation -->
  <header></header>

  <!-- Main Checkout Container -->
  <main class="container section-padding">
    <div class="checkout-layout">
      
      <!-- Checkout Form Panel and Steps -->
      <div>
        <div class="checkout-steps">
          <div class="checkout-step active">
            <div class="step-num">1</div>
            <span class="step-label">Shipping</span>
          </div>
          <div class="checkout-step">
            <div class="step-num">2</div>
            <span class="step-label">Payment</span>
          </div>
          <div class="checkout-step">
            <div class="step-num">3</div>
            <span class="step-label">Review</span>
          </div>
        </div>
        
        <!-- Step 1: Shipping Form -->
        <div class="checkout-panel active glass" style="padding:2.5rem;">
          <h3 style="margin-bottom:1.5rem; color:var(--secondary);">Shipping Coordinates</h3>
          <form onsubmit="event.preventDefault(); nextStep();">
            
            <div class="grid" style="grid-template-columns:1fr 1fr; gap:1.5rem;">
              <div class="form-group">
                <label class="form-label">First Name</label>
                <input type="text" id="ship-firstname" class="form-control" required placeholder="John">
              </div>
              <div class="form-group">
                <label class="form-label">Last Name</label>
                <input type="text" id="ship-lastname" class="form-control" required placeholder="Doe">
              </div>
            </div>
            
            <div class="form-group">
              <label class="form-label">Street Address</label>
              <input type="text" id="ship-address" class="form-control" required placeholder="123 Science Way, Suite 404">
            </div>
            
            <div class="grid" style="grid-template-columns:1.5fr 1fr; gap:1.5rem;">
              <div class="form-group">
                <label class="form-label">City</label>
                <input type="text" id="ship-city" class="form-control" required placeholder="Neo City">
              </div>
              <div class="form-group">
                <label class="form-label">Zip Code</label>
                <input type="text" id="ship-zip" class="form-control" required placeholder="90210">
              </div>
            </div>
            
            <div class="form-group">
              <label class="form-label">Contact Phone</label>
              <input type="tel" id="ship-phone" class="form-control" required placeholder="+1 (555) 019-2834">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width:100%; margin-top:1rem;">Continue to Payment &rarr;</button>
          </form>
        </div>
        
        <!-- Step 2: Payment Form -->
        <div class="checkout-panel glass" style="padding:2.5rem;">
          <h3 style="margin-bottom:1.5rem; color:var(--secondary);">Payment Details</h3>
          <form onsubmit="event.preventDefault(); nextStep();">
            
            <div class="form-group">
              <label class="form-label">Cardholder Name</label>
              <input type="text" id="pay-name" class="form-control" required placeholder="John Doe">
            </div>
            
            <div class="form-group">
              <label class="form-label">Card Number</label>
              <input type="text" id="pay-card" class="form-control" required placeholder="4111 2222 3333 4444" pattern="\\d{16}" title="Please enter a 16-digit card number">
            </div>
            
            <div class="grid" style="grid-template-columns:1fr 1fr; gap:1.5rem;">
              <div class="form-group">
                <label class="form-label">Expiration Date</label>
                <input type="text" id="pay-expiry" class="form-control" required placeholder="MM/YY">
              </div>
              <div class="form-group">
                <label class="form-label">Security CVV</label>
                <input type="password" id="pay-cvv" class="form-control" required placeholder="***" pattern="\\d{3,4}" title="Please enter a 3 or 4 digit security code">
              </div>
            </div>
            
            <div class="flex gap-2" style="margin-top:1.5rem;">
              <button type="button" onclick="prevStep()" class="btn btn-secondary" style="flex:1;">Back</button>
              <button type="submit" class="btn btn-primary" style="flex:1;">Continue to Review &rarr;</button>
            </div>
          </form>
        </div>
        
        <!-- Step 3: Final Review -->
        <div class="checkout-panel glass" style="padding:2.5rem;">
          <h3 style="margin-bottom:1.5rem; color:var(--secondary);">Finalize Order</h3>
          
          <div id="final-review-content" style="margin-bottom:2rem;">
            <!-- Rendered in javascript -->
          </div>
          
          <div class="flex gap-2">
            <button type="button" onclick="prevStep()" class="btn btn-secondary" style="flex:1;">Back</button>
            <button type="button" onclick="nextStep()" class="btn btn-accent" style="flex:1;">Submit Order &rarr;</button>
          </div>
        </div>
      </div>
      
      <!-- Checkout Summary Sidebar -->
      <div class="glass" style="padding:2rem; height:fit-content;">
        <h3 style="margin-bottom:1.5rem; border-bottom:1px solid var(--glass-border); padding-bottom:0.5rem;">Order Summary</h3>
        
        <!-- Items list -->
        <div id="checkout-items-list" style="margin-bottom:1.5rem; border-bottom:1px dashed var(--glass-border); padding-bottom:1rem;">
          <!-- Loaded in JS -->
        </div>
        
        <div class="drawer-summary-row" style="margin-bottom:1rem;">
          <span>Subtotal</span>
          <span id="checkout-subtotal">$0.00</span>
        </div>
        
        <div class="drawer-summary-row" id="checkout-discount-row" style="color:var(--danger); display:none; margin-bottom:1rem;">
          <span>Coupon Discount</span>
          <span id="checkout-discount">-$0.00</span>
        </div>
        
        <div class="drawer-summary-row" style="margin-bottom:1rem;">
          <span>Shipping</span>
          <span id="checkout-shipping">FREE</span>
        </div>
        
        <div class="drawer-summary-row" style="margin-bottom:1rem;">
          <span>Taxes (8%)</span>
          <span id="checkout-tax">$0.00</span>
        </div>
        
        <div class="drawer-summary-row total" style="font-size:1.25rem;">
          <span>Grand Total</span>
          <span id="checkout-total">$0.00</span>
        </div>
      </div>
      
    </div>
  </main>

  <!-- Persistent Footer -->
  <footer></footer>

  <!-- Master JavaScript APIs loading -->
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script src="js/checkout.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Auto-populate delivery fields if user is authenticated session logged in
      const user = NexaAuth.getCurrentUser();
      if (user) {
        const spaceIdx = user.name.indexOf(' ');
        const firstName = spaceIdx > -1 ? user.name.slice(0, spaceIdx) : user.name;
        const lastName = spaceIdx > -1 ? user.name.slice(spaceIdx + 1) : '';
        
        const fInput = document.getElementById('ship-firstname');
        const lInput = document.getElementById('ship-lastname');
        if (fInput) fInput.value = firstName;
        if (lInput) lInput.value = lastName;
      }
    });
  </script>
</body>
</html>
