<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Wishlist — NexaMart</title>
  
  <!-- Global & Page CSS files -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>

  <!-- Persistent Header Navigation -->
  <header></header>

  <!-- Main Wishlist Section -->
  <main class="container section-padding">
    <div style="margin-bottom:3rem;">
      <span class="text-secondary" style="font-weight:600; text-transform:uppercase; letter-spacing:0.1em; font-size:0.85rem;">Saved Collections</span>
      <h1 class="text-gradient" style="font-size:2.2rem; margin-top:0.25rem;">My Wishlist</h1>
    </div>
    
    <!-- Grid of wished cards -->
    <div class="catalog-grid" id="wishlist-grid">
      <!-- Loaded dynamically in wishlist-page.js -->
    </div>
  </main>

  <!-- Slide-out Shopping Cart Drawer Backdrop and Drawer -->
  <div class="drawer-backdrop"></div>
  <div class="drawer">
    <div class="drawer-header">
      <h3 class="drawer-title">🛒 Your Cart</h3>
      <button class="drawer-close-btn" onclick="window.NexaCart.closeCartDrawer()">&times;</button>
    </div>
    <div class="drawer-body">
      <!-- Items dynamically populated -->
    </div>
    <div class="drawer-footer">
      <div class="drawer-summary-row">
        <span>Subtotal</span>
        <span id="drawer-subtotal">$0.00</span>
      </div>
      <div class="drawer-summary-row" id="drawer-discount-row" style="color:var(--danger); display:none;">
        <span>Discount Coupon</span>
        <span id="drawer-discount">-$0.00</span>
      </div>
      <div class="drawer-summary-row">
        <span>Est. Shipping</span>
        <span id="drawer-shipping">FREE</span>
      </div>
      <div class="drawer-summary-row">
        <span>Est. Taxes (8%)</span>
        <span id="drawer-tax">$0.00</span>
      </div>
      <div class="drawer-summary-row total">
        <span>Order Total</span>
        <span id="drawer-total">$0.00</span>
      </div>
      <a href="checkout.html" class="btn btn-primary" style="width:100%;">Proceed To Checkout &rarr;</a>
    </div>
  </div>

  <!-- Persistent Footer -->
  <footer></footer>

  <!-- Master JavaScript APIs loading -->
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script src="js/wishlist-page.js"></script>
</body>
</html>
