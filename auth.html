<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Access — NexaMart</title>
  
  <!-- Global & Page CSS files -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>

  <!-- Persistent Header Navigation -->
  <header></header>

  <!-- Main Auth Container -->
  <main class="container section-padding">
    <div class="auth-container glass scroll-reveal active">
      
      <div class="auth-header">
        <h2 id="auth-title">Welcome Back</h2>
        <p id="auth-desc" style="color:var(--text-secondary);">Access your account, check saved wishlists, and inspect recent purchases.</p>
      </div>
      
      <!-- Toggle buttons between Login / Register -->
      <div class="auth-toggle">
        <button id="toggle-login" class="auth-toggle-btn active" onclick="switchAuthMode('login')">Sign In</button>
        <button id="toggle-register" class="auth-toggle-btn" onclick="switchAuthMode('register')">Create Account</button>
      </div>
      
      <!-- Forms Forms -->
      <form id="auth-form" onsubmit="handleAuthSubmit(event)">
        
        <!-- Registration Full Name (Hidden in login) -->
        <div class="form-group" id="reg-name-group" style="display:none;">
          <label class="form-label">Full Name</label>
          <input type="text" id="auth-name" class="form-control" placeholder="Jane Doe">
        </div>
        
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="auth-email" class="form-control" required placeholder="user@nexamart.com">
        </div>
        
        <div class="form-group" style="margin-bottom:2rem;">
          <label class="form-label">Password</label>
          <input type="password" id="auth-password" class="form-control" required placeholder="••••••••">
        </div>
        
        <button type="submit" id="auth-submit-btn" class="btn btn-primary" style="width:100%;">Sign In</button>
      </form>
      
      <!-- Quick Info helpers -->
      <div style="margin-top:2rem; text-align:center; font-size:0.8rem; color:var(--text-secondary);">
        <p style="margin-bottom:0.5rem;">💡 <strong>Quick Demo Credentials:</strong></p>
        <p style="margin-bottom:0.25rem;"><strong>Admin:</strong> admin@nexamart.com / adminpassword</p>
        <p><strong>User:</strong> user@nexamart.com / userpassword</p>
      </div>
      
    </div>
  </main>

  <!-- Slide-out Shopping Cart Drawer Backdrop and Drawer -->
  <div class="drawer-backdrop"></div>
  <div class="drawer" style="display:none;"></div>

  <!-- Persistent Footer -->
  <footer></footer>

  <!-- Master JavaScript APIs loading -->
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  
  <script>
    let authMode = "login";
    
    document.addEventListener('DOMContentLoaded', () => {
      // Read URL query param to see if register or login is requested
      const mode = NexaUtils.getQueryParam('mode');
      if (mode === 'register') {
        switchAuthMode('register');
      }
    });
    
    function switchAuthMode(mode) {
      authMode = mode;
      
      const title = document.getElementById('auth-title');
      const desc = document.getElementById('auth-desc');
      const nameGroup = document.getElementById('reg-name-group');
      const submitBtn = document.getElementById('auth-submit-btn');
      
      const loginBtn = document.getElementById('toggle-login');
      const registerBtn = document.getElementById('toggle-register');
      
      loginBtn.classList.remove('active');
      registerBtn.classList.remove('active');
      
      if (mode === 'login') {
        loginBtn.classList.add('active');
        title.textContent = "Welcome Back";
        desc.textContent = "Access your account, check saved wishlists, and inspect recent purchases.";
        if (nameGroup) nameGroup.style.display = 'none';
        if (submitBtn) submitBtn.textContent = "Sign In";
        document.getElementById('auth-name').removeAttribute('required');
      } else {
        registerBtn.classList.add('active');
        title.textContent = "Create Account";
        desc.textContent = "Join NexaMart to unlock personalized recommendations, track orders, and build lists.";
        if (nameGroup) nameGroup.style.display = 'block';
        if (submitBtn) submitBtn.textContent = "Create Account";
        document.getElementById('auth-name').setAttribute('required', 'true');
      }
    }
    
    function handleAuthSubmit(event) {
      event.preventDefault();
      
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;
      const name = document.getElementById('auth-name').value.trim();
      
      if (authMode === "login") {
        const res = NexaAuth.loginUser(email, password);
        if (res.success) {
          NexaUtils.showToast(`Logged in successfully as ${res.user.name}!`, "success");
          setTimeout(() => {
            // Redirect to admin dashboard if admin, otherwise to index
            if (res.user.isAdmin) {
              window.location.href = 'admin.html';
            } else {
              window.location.href = 'index.html';
            }
          }, 1000);
        } else {
          NexaUtils.showToast(res.error, "error");
        }
      } else {
        const res = NexaAuth.registerUser(name, email, password);
        if (res.success) {
          NexaUtils.showToast("Account created successfully!", "success");
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1000);
        } else {
          NexaUtils.showToast(res.error, "error");
        }
      }
    }
  </script>
</body>
</html>
